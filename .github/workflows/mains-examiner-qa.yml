name: Mains examiner QA

# Synthetic students only. Unit tests first (no model), then Gemma 4 12B:
# question breakdown -> 5 parallel check shards per student -> second opinion + report.
on:
  push:
    branches: [qa/mains-examiner-v1]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mains-examiner-qa
  cancel-in-progress: true

env:
  MODEL_KEY: mains-gemma-4-12b-it-Q4_K_M-v1
  # A stalled cache download gives up after 5 minutes; the model is then fetched from Hugging Face instead.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
  RUNTIME: llama-cpp-python==0.3.36 huggingface-hub==0.36.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no model)
        run: |
          set +e
          python -m unittest -v test_examiner > unit.log 2>&1
          status=$?
          cat unit.log
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-log
          path: unit.log
          retention-days: 3

  model:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: cache
        uses: actions/cache@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -q huggingface-hub==0.36.0
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('unsloth/gemma-4-12b-it-GGUF', 'gemma-4-12b-it-Q4_K_M.gguf', local_dir='models')"

  prepare:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [wetlands-strong, wetlands-one-sided, wetlands-overclaim, wetlands-off-topic, heat-strong-hi, heat-partial-hi, heat-off-topic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - run: python tools/qa_run.py prepare --case ${{ matrix.case }} --dir qa-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: qa-out
          retention-days: 3

  checks:
    needs: prepare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        case: [wetlands-strong, wetlands-one-sided, wetlands-overclaim, wetlands-off-topic, heat-strong-hi, heat-partial-hi, heat-off-topic]
        shard: [parts, question, content, reasoning, writing]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: qa-out
      - run: python tools/qa_run.py shard --case ${{ matrix.case }} --shard ${{ matrix.shard }} --dir qa-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.case }}-${{ matrix.shard }}
          path: |
            qa-out/shard-*
            qa-out/calls-*-${{ matrix.shard }}.json
            qa-out/error-*
          if-no-files-found: ignore
          retention-days: 3

  finish:
    needs: checks
    if: ${{ !cancelled() && needs.checks.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        case: [wetlands-strong, wetlands-one-sided, wetlands-overclaim, wetlands-off-topic, heat-strong-hi, heat-partial-hi, heat-off-topic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: qa-out
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-${{ matrix.case }}-*
          path: qa-out
          merge-multiple: true
      - run: python tools/qa_run.py finish --case ${{ matrix.case }} --dir qa-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.case }}
          path: |
            qa-out/report-*
            qa-out/error-*
          if-no-files-found: ignore
          retention-days: 7

  # Synthetic reports only: published to a branch so they can be read without signing in.
  publish:
    needs: [unit, finish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{report-*,unit-log}'
          path: reports
          merge-multiple: true
      - name: Publish to qa/mains-examiner-reports
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports && cd reports
          echo "${{ github.run_id }} unit=${{ needs.unit.result }} finish=${{ needs.finish.result }}" > RUN
          git init -q -b qa/mains-examiner-reports
          git config user.name "mains-qa"
          git config user.email "mains-qa@users.noreply.github.com"
          git add -A
          git commit -qm "Synthetic QA reports, run ${{ github.run_id }}"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -qf "https://github.com/${{ github.repository }}.git" HEAD:qa/mains-examiner-reports
