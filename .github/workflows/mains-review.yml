name: Mains review

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Review synthetic samples without any user data
        type: boolean
        default: true
  repository_dispatch:
    types: [mains-answer-queued]
  schedule:
    - cron: "11,41 * * * *"

permissions: {}
concurrency:
  group: mains-${{ github.event_name == 'workflow_dispatch' && inputs.smoke && 'smoke' || 'queue' }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.smoke) || vars.MAINS_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: satyadheesh-upscMains/mocks_test_series-core
          ref: main
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: models
          key: mains-gemma-4-12b-it-Q4_K_M-v1
      - name: Install model runtime
        run: pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Verify synthetic examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
        run: python smoke.py
      - name: Review pending submissions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        env:
          MAINS_WORKER_URL: ${{ vars.MAINS_WORKER_URL }}
          MAINS_WORKER_SECRET: ${{ secrets.MAINS_WORKER_SECRET }}
        run: python worker.py
