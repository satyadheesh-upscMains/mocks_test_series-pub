name: Mains review

# Live queue for UPSC Mains practice feedback. Runs from the public runner repo's main branch and checks out the
# private core. Each slot is one runner that claims submissions from the site one at a time and handles each end to
# end (photo reading, 15 checks, second opinion, report), so student data stays in that runner's memory.
#
# To enable: copy this file to mocks_test_series-pub/.github/workflows/mains-review.yml on main, then set
# vars.MAINS_WORKER_URL and secrets.MAINS_WORKER_SECRET + CORE_TOKEN (contents read on the core repo only).
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Unit tests only, no user data
        type: boolean
        default: true
  repository_dispatch:
    types: [mains-answer-queued]
  schedule:
    - cron: "11,41 * * * *"

permissions: {}
env:
  MODEL_KEY: mains-gemma-4-12b-it-Q4_K_M-v1
  PROJECTOR_KEY: mains-gemma-4-12b-mmproj-F32-v1
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
  RUNTIME: llama-cpp-python==0.3.36 huggingface-hub==0.36.0 Pillow==11.3.0 numpy==2.2.6 pypdf==5.1.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: satyadheesh-upscMains/mocks_test_series-core
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q Pillow==11.3.0 numpy==2.2.6
      - run: python -m unittest test_examiner test_refs test_photo test_worker test_review test_v10 test_v11 2>&1 | tail -n 4

  review:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) && vars.MAINS_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    concurrency:
      group: mains-queue-${{ matrix.slot }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: satyadheesh-upscMains/mocks_test_series-core
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models/gemma-4-12b-it-Q4_K_M.gguf
          key: ${{ env.MODEL_KEY }}
      - uses: actions/cache@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models/mmproj-F32.gguf
          key: ${{ env.PROJECTOR_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - uses: actions/cache/restore@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: refs/cache
          key: mains-ncert-polity-v1
      - name: Build reference index (Constitution + NCERT, counts only)
        timeout-minutes: 10
        run: python tools/build_refs.py
      - name: Review queued submissions
        env:
          MAINS_WORKER_URL: ${{ vars.MAINS_WORKER_URL }}
          MAINS_WORKER_SECRET: ${{ secrets.MAINS_WORKER_SECRET }}
        run: python worker.py
