name: Mains review

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Review synthetic samples without any user data
        type: boolean
        default: true
  repository_dispatch:
    types: [mains-answer-queued]
  schedule:
    - cron: "11,41 * * * *"

permissions: {}
concurrency:
  group: mains-${{ github.event_name == 'workflow_dispatch' && inputs.smoke && 'smoke' || 'queue' }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.smoke) || vars.MAINS_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        with:
          repository: satyadheesh-upscMains/mocks_test_series-core
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: models
          key: mains-gemma-4-12b-it-Q4_K_M-v1
      - name: Install model runtime
        run: pip install llama-cpp-python==0.3.36 huggingface-hub==0.36.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Verify synthetic examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from llama_cpp import Llama
          import json
          path = hf_hub_download("unsloth/gemma-4-12b-it-GGUF", "gemma-4-12b-it-Q4_K_M.gguf", local_dir="models")
          model = Llama(model_path=path, n_ctx=2048, n_gpu_layers=0, verbose=False)
          for answer, valid in [("Wetlands hold water and reduce runoff.", True), ("Cricket matches draw crowds.", False)]:
              out = model.create_chat_completion(
                  messages=[{"role": "user", "content": "Does the following answer address how wetlands reduce floods? Return JSON with a boolean field relevant. Answer: " + answer}],
                  response_format={"type":"json_object","schema":{"type":"object","required":["relevant"],"properties":{"relevant":{"type":"boolean"}}}},
                  temperature=0, max_tokens=256)
              assert json.loads(out["choices"][0]["message"]["content"])["relevant"] is valid
          print("Synthetic on-task/off-task runtime check passed.")
          PY
      - name: Review pending submissions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        env:
          MAINS_WORKER_URL: ${{ vars.MAINS_WORKER_URL }}
          MAINS_WORKER_SECRET: ${{ secrets.MAINS_WORKER_SECRET }}
        run: python worker.py 2>/dev/null
