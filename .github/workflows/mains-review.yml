name: Mains review

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Review synthetic samples without any user data
        type: boolean
        default: true
  repository_dispatch:
    types: [mains-answer-queued]
  schedule:
    - cron: "11,41 * * * *"

permissions: {}
concurrency:
  group: mains-${{ github.event_name == 'workflow_dispatch' && inputs.smoke && 'smoke' || 'queue' }}
  cancel-in-progress: false

jobs:
  review:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.smoke) || vars.MAINS_WORKER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.smoke && '["en","hi"]' || '["queue"]') }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        with:
          repository: satyadheesh-upscMains/mocks_test_series-core
          ref: main
          token: ${{ secrets.CORE_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: models
          key: mains-gemma-4-12b-it-Q4_K_M-v1
      - name: Install model runtime
        run: pip install llama-cpp-python==0.3.36 huggingface-hub==0.36.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - name: Verify synthetic examples
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
        env:
          SMOKE_LANG: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          from llama_cpp import Llama
          import json, os, re
          path = hf_hub_download("unsloth/gemma-4-12b-it-GGUF", "gemma-4-12b-it-Q4_K_M.gguf", local_dir="models")
          model = Llama(model_path=path, n_ctx=2048, n_gpu_layers=0, verbose=False)
          hi = os.environ["SMOKE_LANG"] == "hi"
          question = "शहरी आर्द्रभूमि बाढ़ कम कैसे करती हैं?" if hi else "How do urban wetlands reduce flooding?"
          answers = ("आर्द्रभूमि बारिश का पानी जमा करती हैं और बहाव कम करती हैं।", "क्रिकेट के मैच देखने बहुत लोग आते हैं।") if hi else (
              "Wetlands hold water and reduce runoff.", "Cricket matches draw crowds.")
          for answer, valid in zip(answers, (True, False)):
              lang = "Hindi in Devanagari" if hi else "English"
              out = model.create_chat_completion(
                  messages=[{"role": "user", "content": f"Does the answer address the question? Write one short reason in {lang}. Question: {question} Answer: {answer}"}],
                  response_format={"type":"json_object","schema":{"type":"object","required":["relevant","reason"],"properties":{"relevant":{"type":"boolean"},"reason":{"type":"string"}}}},
                  temperature=0, max_tokens=256)
              feedback = json.loads(out["choices"][0]["message"]["content"])
              assert feedback["relevant"] is valid
              assert len(feedback["reason"].strip()) >= 8
              if hi:
                  assert len(re.findall("[अ-ॿ]", feedback["reason"])) >= 6
          print("Synthetic scope and feedback-language checks passed.")
          PY
      - name: Review pending submissions
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.smoke) }}
        env:
          MAINS_WORKER_URL: ${{ vars.MAINS_WORKER_URL }}
          MAINS_WORKER_SECRET: ${{ secrets.MAINS_WORKER_SECRET }}
        run: python worker.py 2>/dev/null
