name: Mains split QA

# The faster path: one synthetic answer spread across runners. Unit tests (no model), then Gemma 4 12B:
# question breakdown + Constitution sources (1 runner per answer) -> one focused check per runner (15 per answer)
# -> second opinion + report + the same gates as the end-to-end run (1 runner per answer). Eight Polity answers with
# planted errors the Constitution settles, plus the wetlands answer as a regression check. Synthetic fixtures only:
# in-between files are artifacts here, which the live queue never uses for real students.
on:
  push:
    branches: [qa/mains-e2e]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: mains-split-qa
  cancel-in-progress: true

env:
  MODEL_KEY: mains-gemma-4-12b-it-Q4_K_M-v1
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '5'
  RUNTIME: llama-cpp-python==0.3.36 huggingface-hub==0.36.0 Pillow==11.3.0 numpy==2.2.6 pypdf==5.1.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q Pillow==11.3.0 numpy==2.2.6
      - name: Unit tests (no model)
        run: |
          set +e
          python -m unittest -v test_examiner test_refs test_photo test_worker test_review test_v10 test_v11 > unit-split.log 2>&1
          status=$?
          cat unit-split.log
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-split-log
          path: unit-split.log
          retention-days: 3

  # v11: the sources each planted error needs, checked in about three minutes before any Gemma call. If a planted
  # error cannot reach the Article that settles it, or the off-syllabus answer gets a source, the run stops here.
  # With the pinned multilingual-e5-small model (ONNX int8 + its own tokenizer) it also records what embeddings would
  # pick, in English and Hindi (measured, not used in grading).
  retrieval:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          path: models/e5
          key: mains-e5-small-onnx-int8-v1
      - run: pip install -q ${{ env.RUNTIME }} onnxruntime==1.20.1 tokenizers==0.21.0
      - name: Build reference index
        timeout-minutes: 10
        run: python tools/build_refs.py
      # Which answers this run grades: qa/split-cases.json. All eight before any merge into main; a fix that touches
      # one answer can be checked on that answer alone first (about 35 minutes instead of two hours).
      - id: cases
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          allowed = ["polity-local", "polity-art21", "polity-eci", "polity-governor", "polity-amend",
                     "polity-moneybill", "polity-356", "polity-dpsp"]
          path = Path("qa/split-cases.json")
          cases = json.loads(path.read_text()) if path.exists() else allowed
          cases = [c for c in cases if c in allowed] or allowed
          print("cases=" + json.dumps(cases))
          PY
      - name: Planted errors reach their Articles
        run: python tools/retrieval_check.py
        env:
          MAINS_EMBED_DOWNLOAD: '1'
      - uses: actions/cache/save@v4
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: models/e5
          key: mains-e5-small-onnx-int8-v1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-retrieval
          path: retrieval-out
          if-no-files-found: ignore
          retention-days: 7

  prepare:
    needs: retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.retrieval.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - name: Build reference index
        timeout-minutes: 10
        run: python tools/build_refs.py
      - run: python tools/split_qa.py prepare --case ${{ matrix.case }} --dir split-out
      - uses: actions/upload-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: split-out
          retention-days: 3

  plan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tasks: ${{ steps.plan.outputs.tasks }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: prep-*
          path: split-out
          merge-multiple: true
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          rows = []
          for f in sorted(glob.glob("split-out/tasks-*.json")):
              case = f.split("tasks-", 1)[1][:-5]
              rows += [{"case": case, "check": c, "slug": c.replace(":", "-")} for c in json.load(open(f))]
          print("tasks=" + json.dumps(rows))
          PY

  checks:
    needs: plan
    name: check ${{ matrix.case }} ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: split-out
      - run: python tools/split_qa.py task --case ${{ matrix.case }} --check '${{ matrix.check }}' --dir split-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-${{ matrix.case }}-${{ matrix.slug }}
          path: |
            split-out/task-*
            split-out/calls-*-${{ matrix.slug }}.json
            split-out/error-*
          if-no-files-found: ignore
          retention-days: 3

  finish:
    needs: [retrieval, checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJSON(needs.retrieval.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        timeout-minutes: 12
        continue-on-error: true
        with:
          path: models
          key: ${{ env.MODEL_KEY }}
      - run: pip install -q ${{ env.RUNTIME }}
      - uses: actions/download-artifact@v4
        with:
          name: prep-${{ matrix.case }}
          path: split-out
      - uses: actions/download-artifact@v4
        with:
          pattern: task-${{ matrix.case }}-*
          path: split-out
          merge-multiple: true
      - run: python tools/split_qa.py finish --case ${{ matrix.case }} --dir split-out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-${{ matrix.case }}
          path: |
            split-out/split-*
            split-out/error-*
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [unit, retrieval, finish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{split-*,unit-split-log}'
          path: reports
          merge-multiple: true
      - name: Publish to qa/mains-split-reports
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports && cd reports
          echo "${{ github.run_id }} unit=${{ needs.unit.result }} retrieval=${{ needs.retrieval.result }} finish=${{ needs.finish.result }}" > RUN
          git init -q -b qa/mains-split-reports
          git config user.name "mains-qa"
          git config user.email "mains-qa@users.noreply.github.com"
          git add -A
          git commit -qm "Synthetic split QA, run ${{ github.run_id }}"
          AUTH=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -qf "https://github.com/${{ github.repository }}.git" HEAD:qa/mains-split-reports
