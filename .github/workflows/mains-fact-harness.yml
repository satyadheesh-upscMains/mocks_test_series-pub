name: Mains fact harness
on:
  push:
    branches: [qa/mains-harness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mains-fact-harness
  cancel-in-progress: true
env:
  CORE_SHA: da2dea03a79cb986722aa7dce3efb4fb185d2566
  MODEL_KEY: mains-gemma-4-12b-it-Q4_K_M-v1
  RUNTIME: llama-cpp-python==0.3.36 huggingface-hub==0.36.0 Pillow==11.3.0 numpy==2.2.6 pypdf==5.1.0 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
jobs:
  facts:
    strategy:
      fail-fast: false
      matrix: {repeat: [1, 2]}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {repository: satyadheesh-upscMains/mocks_test_series-core, ref: '${{ env.CORE_SHA }}', token: '${{ secrets.CORE_TOKEN }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/cache/restore@v4
        with: {path: models, key: '${{ env.MODEL_KEY }}'}
      - run: pip install -q ${{ env.RUNTIME }}
      - run: python tools/build_refs.py
      - run: python tools/fact_harness.py --repeat 1 --out fact-harness-${{ matrix.repeat }}.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: fact-harness-${{ matrix.repeat }}, path: fact-harness-${{ matrix.repeat }}.json, retention-days: 7}
